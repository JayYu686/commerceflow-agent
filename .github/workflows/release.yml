name: Release v1.1

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements-lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements-lock.txt
      - name: Backend tests
        working-directory: services/api
        run: python -m pytest -q
      - name: Ruff check
        working-directory: services/api
        run: python -m ruff check app tests scripts
      - name: Ruff format check
        working-directory: services/api
        run: python -m ruff format --check app tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Frontend lint
        working-directory: apps/web
        run: npm run lint
      - name: Frontend build
        working-directory: apps/web
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start evaluation database
        run: docker compose up -d postgres
      - name: Prepare durable workflow database
        working-directory: services/api
        run: |
          python -m alembic upgrade head
          python -m scripts.setup_checkpoints
          python -m scripts.seed_demo_data --reset
          python -m scripts.ingest_policies --reset
      - name: Start API for browser tests
        working-directory: services/api
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/commerceflow-api.log 2>&1 &
      - name: Wait for API health
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - name: Start web for browser tests
        working-directory: apps/web
        run: nohup node node_modules/next/dist/bin/next start >/tmp/commerceflow-web.log 2>&1 &
      - name: Wait for web console
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:3000/
      - name: Durable workflow browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: packaging/windows-launcher/go.mod
      - name: Launcher tests
        working-directory: packaging/windows-launcher
        run: go test ./...
      - name: Build API image
        run: docker build --build-arg VERSION=${GITHUB_REF_NAME} --build-arg REVISION=${GITHUB_SHA} -f services/api/Dockerfile -t commerceflow-agent-api:test .
      - name: Build web image
        run: docker build --build-arg VERSION=${GITHUB_REF_NAME} --build-arg REVISION=${GITHUB_SHA} -f apps/web/Dockerfile -t commerceflow-agent-web:test .

  publish-images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
            image: ghcr.io/jayyu686/commerceflow-agent-api
          - component: web
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/jayyu686/commerceflow-agent-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest

  build-windows-launcher:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: packaging/windows-launcher/go.mod
      - name: Test launcher
        working-directory: packaging/windows-launcher
        run: go test ./...
      - name: Build launcher and release archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $assetRoot = Join-Path $PWD "dist\CommerceFlowAgent-$version-windows-amd64"
          New-Item -ItemType Directory -Path $assetRoot -Force | Out-Null
          Push-Location packaging\windows-launcher
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$assetRoot\CommerceFlowAgent.exe" .
          Pop-Location
          Copy-Item packaging\windows-launcher\compose.demo.yml "$assetRoot\compose.demo.yml"
          Copy-Item packaging\windows-launcher\otel-collector-config.yaml "$assetRoot\otel-collector-config.yaml"
          Copy-Item packaging\windows-launcher\README-体验说明.txt "$assetRoot\README-体验说明.txt"
          Copy-Item LICENSE "$assetRoot\LICENSE"
          $archive = Join-Path $PWD "dist\CommerceFlowAgent-$version-windows-amd64.zip"
          Compress-Archive -Path "$assetRoot\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Encoding ascii dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    needs:
      - publish-images
      - build-windows-launcher
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: CommerceFlow Agent ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## CommerceFlow Agent ${{ github.ref_name }}

            Windows x64 本地演示版。运行前请安装并启动 Docker Desktop。

            本版本只产生本地 Mock 退款、优惠券和工单记录，不调用真实外部系统。

            本版本新增 PostgreSQL 持久化 LangGraph Checkpoint、审批与执行确认 Interrupt/Resume、stdio MCP 执行闭环、OpenTelemetry 可观测性、可选 OpenAI-compatible Embedding，以及 120 条确定性评测基线。

            下载 ZIP 后请使用 `SHA256SUMS.txt` 校验完整性。当前 Windows 启动器未进行商业代码签名，SmartScreen 可能显示提示。
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
