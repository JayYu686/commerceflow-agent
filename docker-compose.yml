services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commerceflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerceflow}
      POSTGRES_USER: ${POSTGRES_USER:-commerceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerceflow_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.131.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    profiles: ["observability"]
    ports:
      - "16686:16686"

volumes:
  postgres_data:
