name: commerceflow-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: commerceflow
      POSTGRES_USER: commerceflow
      POSTGRES_PASSWORD: commerceflow_demo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerceflow -d commerceflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/jayyu686/commerceflow-agent-api:${COMMERCEFLOW_VERSION:-v1.1.3}
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql+psycopg://commerceflow:commerceflow_demo_password@postgres:5432/commerceflow
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      LLM_PROVIDER: disabled
      EMBEDDING_PROVIDER: deterministic
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      TRACE_UI_URL: http://localhost:16686
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    image: ghcr.io/jayyu686/commerceflow-agent-web:${COMMERCEFLOW_VERSION:-v1.1.3}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector:0.131.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    profiles: ["observability"]
    ports:
      - "16686:16686"

volumes:
  postgres_data:
